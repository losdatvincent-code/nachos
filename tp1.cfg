##################################################
# configuration NachOS pour les tests du TP 1
# utilisation :  ./nachos -f tp1.cfg -x /test_sem
#
# pourquoi 4000 pages au lieu de 5 : sans la pagination a la demande
# (TP 2), tout est charge en memoire des le debut, et la pile de chaque
# thread prend UserStackSize / PageSize = 4096 / 128 = 32 pages.
# avec 5 pages, meme le premier thread ne peut pas demarrer.
##################################################

NumPhysPages      = 4000
UserStackSize     = 4096
MaxFileNameSize   = 256
NumDirEntries     = 30
NumPortLoc        = 32009
NumPortDist       = 32010
ProcessorFrequency = 100
SectorSize        = 128
PageSize          = 128
MaxVirtPages      = 200000

# String values
###############
FileToCopy        = test/hello /hello

# Boolean values
################
PrintStat        = 0
FormatDisk       = 1
ListDir          = 0
PrintFileSyst    = 0

ProgramToRun     = /hello
